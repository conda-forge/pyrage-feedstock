schema_version: 1

context:
  version: "1.4.0"

package:
  name: pyrage
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyrage/pyrage-${{ version }}.tar.gz
  sha256: 545bf188e8d217ec88c32bc8e8bf56026c8c0b1b1f96d2688cedf1427ab0e827

build:
  number: 1
  skip: is_abi3 and not is_python_min
  python:
    version_independent: ${{ is_abi3 }}
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
      - python -m pip install . --no-deps --ignore-installed -vv --no-build-isolation --disable-pip-version-check

requirements:
  build:
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.0,<2.0
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - cargo-bundle-licenses
  host:
    - python
    - maturin >=1.0,<2.0
    - pip
    - if: is_abi3
      then: python-abi3
  run:
    - python

tests:
  - python:
      imports:
        - pyrage
      python_version:
        - ${{ python_min }}.*
        - '*'
      pip_check: true
  - if: is_abi3
    then:
      script:
        - if: win
          then: abi3audit %SP_DIR%/pyrage/pyrage.pyd -s -v --assume-minimum-abi3 ${{ python_min }}
          else: abi3audit $SP_DIR/pyrage/pyrage.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
      requirements:
        run:
          - abi3audit

about:
  summary: Python bindings for rage (age in Rust)
  license: MIT
  license_file:
    - LICENSE
    - pyrage-stubs/LICENSE
    - THIRDPARTY.yml
  homepage: https://github.com/woodruffw/pyrage

extra:
  recipe-maintainers:
    - pavelzw
